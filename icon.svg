<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Coffee cup + Lightning energy mark -->
  <g transform="translate(106, 110)">
    <!-- Cup Body -->
    <path d="M 40 50 L 260 50 C 255 170 215 250 150 250 C 85 250 45 170 40 50 Z" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Cup Handle -->
    <path d="M 245 80 C 290 80 305 110 305 140 C 305 175 285 200 230 200" 
          fill="none" 
          stroke="url(#glowGrad)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Dynamic Lightning Bolt inside cup -->
    <path d="M 165 70 L 125 145 L 155 145 L 135 220 L 185 135 L 155 135 Z" 
          fill="url(#glowGrad)" 
          filter="url(#glow)"/>

    <!-- Steam Waves -->
    <path d="M 115 15 C 110 0 125 -15 120 -30" 
          fill="none" 
          stroke="#f59e0b" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-opacity="0.75"/>
    <path d="M 150 15 C 145 -5 160 -20 155 -40" 
          fill="none" 
          stroke="#fbbf24" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>
    <path d="M 185 15 C 180 0 195 -15 190 -30" 
          fill="none" 
          stroke="#f59e0b" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-opacity="0.75"/>
  </g>
</svg>
